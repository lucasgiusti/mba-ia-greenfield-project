services:
  nestjs-api:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 3000:3000
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      redis:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully

  video-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Consumes the video-processing queue on `docker compose up -d`
    # (the HTTP API in nestjs-api still starts idle).
    command: ["npm", "run", "start:worker:dev"]
    restart: unless-stopped
    # docker-init (tini) relays SIGTERM to the whole process group, so the
    # worker process (behind npm + nest --watch) runs its shutdown hooks.
    init: true
    environment:
      TINI_KILL_PROCESS_GROUP: "1"
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=streamtube
      - POSTGRES_PASSWORD=streamtube
      - POSTGRES_DB=streamtube
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  redis:
    image: redis:8.2.10-bookworm
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    # Chainguard build of MinIO (minio/minio is no longer pullable); pinned by digest.
    # Image has no shell, so no healthcheck — readiness is checked by minio-bootstrap.
    image: cgr.dev/chainguard/minio@sha256:cff197fef764642223ef9f4444c903d51aee9b544a7be8bc007fef6b7b00d136
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    volumes:
      - minio-data:/data

  minio-bootstrap:
    # cgr.dev/chainguard/minio-client:latest-dev (ships a shell), pinned by digest.
    image: cgr.dev/chainguard/minio-client@sha256:4ded9b0773ebf1afded36c4e91efad0d4e7dee91c6b3d5d29455732095afb2d0
    depends_on:
      minio:
        condition: service_started
    environment:
      MC_HOST_local: http://${STORAGE_ACCESS_KEY}:${STORAGE_SECRET_KEY}@minio:9000
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc ready local && mc mb --ignore-existing local/${STORAGE_BUCKET}"]
    restart: "no"

volumes:
  minio-data: {}
